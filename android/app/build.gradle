plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.zaptv'
    compileSdk 34

    defaultConfig {
        applicationId 'ar.zaptv.app'
        minSdk 21
        targetSdk 34
        versionCode (project.findProperty('verCode') ?: '3').toInteger()
        versionName '1.2'
    }

    signingConfigs {
        debug {
            storeFile file('../zaptv.keystore')
            storePassword 'zaptv123'
            keyAlias 'zaptv'
            keyPassword 'zaptv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
