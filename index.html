<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZapTV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#e8ffe8;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#stage iframe,#yt{width:100%;height:100%;border:0}
#tap{position:fixed;inset:0;z-index:5}
#noise{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;display:none}
#osd{position:fixed;top:4vh;right:4vw;z-index:8;text-align:right;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 0 8px #000,0 2px 2px #000}
#osd.on{opacity:1}
#osdn{display:block;font:700 clamp(40px,8vw,96px)/1 ui-monospace,Consolas,monospace;color:#5dff7a}
#osdc{display:block;font-size:clamp(16px,2.4vw,28px);font-weight:600}
#osdk{display:block;font-size:clamp(12px,1.6vw,18px);color:#5dff7a;letter-spacing:.08em;text-transform:uppercase}
#osdt{display:block;font-size:clamp(12px,1.5vw,18px);opacity:.8;max-width:50vw;margin-left:auto}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .3s,transform .3s}
#bar.hide{opacity:0;transform:translateY(20px);pointer-events:none}
button,select{background:#1b2a1f;color:#e8ffe8;border:1px solid #2f4a36;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer}
button:hover{background:#27402e}
button.pri{background:#2e7d45;border-color:#3fae5f}
button.sm{padding:6px 10px;font-size:13px}
input[type=range]{accent-color:#5dff7a;width:90px}
#guide{position:fixed;top:0;left:0;bottom:0;width:min(380px,92vw);z-index:10;background:rgba(8,16,10,.96);border-right:1px solid #2f4a36;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column}
#guide.on{transform:none}
#guide h2{padding:16px;font-size:18px;border-bottom:1px solid #2f4a36;display:flex;justify-content:space-between;align-items:center}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid #14221a}
.chip{padding:5px 11px;border-radius:99px;font-size:13px;background:#14221a;border:1px solid #2f4a36;cursor:pointer}
.chip.on{background:#2e7d45;border-color:#3fae5f}
#list{overflow:auto;flex:1}
.ch{display:flex;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid #14221a;align-items:center}
.ch:hover{background:#17281c}
.ch.cur{background:#1f3a27}
.ch b{font:700 18px ui-monospace,Consolas,monospace;color:#5dff7a;min-width:34px}
.ch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ch i{font-style:normal;font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.05em}
#editor{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px}
#editor.on{display:flex}
.box{background:#0d1810;border:1px solid #2f4a36;border-radius:12px;padding:20px;width:min(760px,100%);max-height:94vh;overflow:auto}
.box h2{margin-bottom:10px}
.box h3{margin:18px 0 8px;font-size:14px;opacity:.85}
.box p{font-size:13px;opacity:.75;margin-bottom:10px;line-height:1.45}
input[type=text],input[type=password]{width:100%;background:#07100a;color:#e8ffe8;border:1px solid #2f4a36;border-radius:8px;padding:9px;font:14px system-ui,Segoe UI,Roboto,sans-serif}
.add{display:grid;grid-template-columns:1fr 1.6fr 1fr auto;gap:8px;align-items:center}
@media(max-width:640px){.add{grid-template-columns:1fr}}
.erow{display:grid;grid-template-columns:30px 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #14221a}
.erow b{font:700 14px ui-monospace,Consolas,monospace;color:#5dff7a}
.erow .u{grid-column:2/5;font-size:11px;opacity:.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
label{display:block;margin-top:12px;font-size:13px;opacity:.85}
#status{font-size:13px;margin-top:8px;min-height:18px;color:#ffd06a;white-space:pre-line}
#power{position:fixed;inset:0;z-index:30;background:#050805;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer}
#power h1{font:700 clamp(40px,9vw,90px) ui-monospace,Consolas,monospace;color:#5dff7a;letter-spacing:.1em}
#power p{opacity:.7}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;background:#3a1d1d;border:1px solid #7a3a3a;padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
</style>
</head>
<body>
<div id="stage"><div id="yt"></div></div>
<div id="tap"></div>
<canvas id="noise"></canvas>
<div id="osd"><span id="osdn"></span><span id="osdc"></span><span id="osdk"></span><span id="osdt"></span></div>

<div id="bar">
  <button id="bGuide" title="Guía (G)">☰ Guía</button>
  <select id="catSel" title="Categoría (C)"></select>
  <button id="bPrev" title="Canal anterior (↓)">◀ CH</button>
  <button id="bNext" title="Canal siguiente (↑)">CH ▶</button>
  <button id="bRand" class="pri" title="Canal al azar (R)">🎲 Zap</button>
  <button id="bVPrev" title="Video anterior (←)">⏮</button>
  <button id="bPlay" title="Pausa/Play (Espacio)">⏯</button>
  <button id="bVNext" title="Video siguiente (→)">⏭</button>
  <button id="bMute" title="Silencio (M)">🔊</button>
  <input type="range" id="vol" min="0" max="100" value="80">
  <button id="bFull" title="Pantalla completa (F)">⛶</button>
  <button id="bEdit" title="Editar canales (E)">⚙ Canales</button>
</div>

<aside id="guide">
  <h2>Guía de canales <button id="gClose">✕</button></h2>
  <div id="chips"></div>
  <div id="list"></div>
</aside>

<div id="editor"><div class="box">
  <h2>Canales</h2>
  <h3>➕ Nuevo canal</h3>
  <div class="add">
    <input type="text" id="nName" placeholder="Nombre (opcional)">
    <input type="text" id="nUrl" placeholder="URL, ej: https://www.youtube.com/outdoorboys">
    <input type="text" id="nCat" list="cats" placeholder="Categoría">
    <button class="pri" id="nAdd">Agregar</button>
  </div>
  <datalist id="cats"></datalist>
  <p style="margin-top:8px">Acepta: <code>youtube.com/nombre</code>, <code>/@handle</code>, <code>/c/nombre</code>, <code>/user/nombre</code>, <code>/channel/UC…</code>, ID <code>UC…</code>, listas (<code>list=PL…</code>) y videos sueltos.</p>
  <div id="status"></div>

  <h3>Tus canales</h3>
  <div id="elist"></div>

  <label>API key de YouTube Data v3 (opcional, gratuita; mejora la resolución de nombres de canal)
    <input type="password" id="apikey" placeholder="AIza...">
  </label>
  <div class="row">
    <button class="pri" id="eClose">Listo</button>
    <button id="eExport">Exportar</button>
    <button id="eImport">Importar</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
</div></div>

<div id="power"><h1>ZAPTV</h1><p>Click para encender · ↑↓ canal · 0-9 número · R azar · C categoría · G guía</p></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const PRESET_CATS=['Deportes','Historia','Curiosidades','Ciencia','Documentales','Música','Noticias','Cocina','Viajes','Humor','Educación','Tecnología','Naturaleza','Cine','General'];
const DEFAULTS=[
 {name:'NASA',src:'UCLA_DiR1FfKNvjuUpBHmylQ',list:'UULA_DiR1FfKNvjuUpBHmylQ',cat:'Ciencia'},
 {name:'Kurzgesagt',src:'UCsXVk37bltHxD1rDPwtNM8Q',list:'UUsXVk37bltHxD1rDPwtNM8Q',cat:'Curiosidades'},
 {name:'TED',src:'UCAuUUnT6oDeKwE6v1NGQxug',list:'UUAuUUnT6oDeKwE6v1NGQxug',cat:'Educación'},
 {name:'Veritasium',src:'UCHnyfMqiRRG1u-2MsSQLbXA',list:'UUHnyfMqiRRG1u-2MsSQLbXA',cat:'Ciencia'}
];
let channels=LS('zap_channels',DEFAULTS).map(c=>({...c,cat:c.cat||'General'}));
let cur=LS('zap_cur',0), vol=LS('zap_vol',80), filter=LS('zap_filter',''), muted=false;
if(cur>=channels.length)cur=0;
let player=null, ready=false, powered=false, seekPending=false, errStreak=0, lastIdx=0, numBuf='';
let osdT,uiT,numT;
const saveCh=()=>SV('zap_channels',channels);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- Categorías / pool ---------- */
const usedCats=()=>[...new Set(channels.map(c=>c.cat||'General'))].sort((a,b)=>a.localeCompare(b,'es'));
function pool(){const p=[];channels.forEach((c,i)=>{if(!filter||c.cat===filter)p.push(i)});return p.length?p:channels.map((_,i)=>i)}
function setFilter(f,doTune=true){
  filter=f;SV('zap_filter',filter);renderCats();renderGuide();
  if(doTune&&channels.length){const p=pool();tune(p.includes(cur)?cur:p[Math.floor(Math.random()*p.length)])}
}
function renderCats(){
  const u=usedCats();if(filter&&!u.includes(filter))filter='';
  $('#catSel').innerHTML='<option value="">📺 Todas</option>'+u.map(c=>`<option value="${esc(c)}"${c===filter?' selected':''}>${esc(c)}</option>`).join('');
  $('#chips').innerHTML=['',...u].map(c=>`<span class="chip${c===filter?' on':''}" data-c="${esc(c)}">${c?esc(c):'Todas'}</span>`).join('');
  $('#cats').innerHTML=[...new Set([...PRESET_CATS,...u])].map(c=>`<option value="${esc(c)}">`).join('');
}
$('#catSel').onchange=e=>setFilter(e.target.value);
$('#chips').addEventListener('click',e=>{const el=e.target.closest('.chip');if(el)setFilter(el.dataset.c)});

/* ---------- YouTube API ---------- */
const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
window.onYouTubeIframeAPIReady=()=>{
  const pv={controls:0,disablekb:1,modestbranding:1,rel:0,iv_load_policy:3,playsinline:1,fs:0,autoplay:1};
  if(/^https?:/.test(location.protocol))pv.origin=location.origin;
  player=new YT.Player('yt',{width:'100%',height:'100%',playerVars:pv,events:{
    onReady:()=>{ready=true;player.setVolume(vol);if(powered)tune(cur)},
    onStateChange:onState,onError:onErr}});
};
function onState(e){
  if(e.data===1){
    errStreak=0;hideNoise();
    if(seekPending){seekPending=false;
      try{const d=player.getDuration();if(d>400)player.seekTo(Math.random()*d*0.7,true)}catch(_){}}
    try{const t=player.getVideoData().title;if(t)$('#osdt').textContent=t}catch(_){}
  }
  if(e.data===0&&channels[cur]&&channels[cur].vid)tune(cur);
}
function onErr(){
  const c=channels[cur];
  if(c&&c.list&&lastIdx>0){lastIdx=0;player.loadPlaylist({listType:'playlist',list:c.list,index:0});return}
  errStreak++;
  if(errStreak<4){setTimeout(()=>{try{player.nextVideo()}catch(_){}},800)}
  else{hideNoise();toast('No se pudo reproducir "'+(c?c.name:'')+'" (embebido deshabilitado o canal inválido). Cambia de canal.')}
}

/* ---------- Sintonizar ---------- */
function tune(i){
  if(!channels.length){openEditor();return}
  cur=((i%channels.length)+channels.length)%channels.length;SV('zap_cur',cur);
  const c=channels[cur];
  showNoise(900);osd();renderGuide();errStreak=0;seekPending=true;
  $('#osdt').textContent='';
  if(!ready)return;
  if(c.vid)player.loadVideoById(c.vid);
  else{lastIdx=Math.floor(Math.random()*25);player.loadPlaylist({listType:'playlist',list:c.list,index:lastIdx})}
  player.setVolume(vol);muted?player.mute():player.unMute();
}
function step(d){
  const p=pool(),k=p.indexOf(cur);
  tune(k<0?p[0]:p[(k+d+p.length)%p.length]);
}
const next=()=>step(1), prev=()=>step(-1);
function rand(){const p=pool();if(p.length<2)return tune(cur);let i;do{i=p[Math.floor(Math.random()*p.length)]}while(i===cur);tune(i)}
function vNext(){if(!ready)return;const c=channels[cur];if(c&&c.vid)return tune(cur);showNoise(400);seekPending=true;try{player.nextVideo()}catch(_){}}
function vPrev(){if(!ready)return;const c=channels[cur];if(c&&c.vid)return tune(cur);showNoise(400);try{player.previousVideo()}catch(_){}}
function cycleCat(){const u=['',...usedCats()];setFilter(u[(u.indexOf(filter)+1)%u.length])}

/* ---------- OSD / ruido ---------- */
function osd(txt){
  const c=channels[cur];
  $('#osdn').textContent=txt!=null?txt:String(cur+1).padStart(2,'0');
  $('#osdc').textContent=txt!=null?'':(c?c.name:'');
  $('#osdk').textContent=txt!=null?'':(c?c.cat:'');
  $('#osd').classList.add('on');clearTimeout(osdT);osdT=setTimeout(()=>$('#osd').classList.remove('on'),3500);
}
const cv=$('#noise'),cx=cv.getContext('2d');let noiseRAF=0,noiseEnd=0;
function showNoise(ms){
  cv.width=Math.ceil(innerWidth/4);cv.height=Math.ceil(innerHeight/4);cv.style.display='block';noiseEnd=performance.now()+ms;
  cancelAnimationFrame(noiseRAF);
  const draw=t=>{
    if(t>noiseEnd){cv.style.display='none';return}
    const im=cx.createImageData(cv.width,cv.height),d=im.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}
    cx.putImageData(im,0,0);noiseRAF=requestAnimationFrame(draw);
  };
  noiseRAF=requestAnimationFrame(draw);
}
function hideNoise(){noiseEnd=0}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000)}

/* ---------- Guía ---------- */
function renderGuide(){
  const html=channels.map((c,i)=>(!filter||c.cat===filter)?`<div class="ch ${i===cur?'cur':''}" data-i="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(c.name)}</span><i>${esc(c.cat)}</i></div>`:'').join('');
  $('#list').innerHTML=html||'<div class="ch">Sin canales. Abre ⚙ Canales.</div>';
}
$('#list').addEventListener('click',e=>{const el=e.target.closest('.ch');if(el&&el.dataset.i!=null){tune(+el.dataset.i);$('#guide').classList.remove('on')}});
const toggleGuide=()=>$('#guide').classList.toggle('on');

/* ---------- Resolución de URLs ---------- */
async function fetchPage(url){
  for(const p of ['https://api.allorigins.win/raw?url=','https://corsproxy.io/?']){
    try{
      const r=await fetch(p+encodeURIComponent(url));if(!r.ok)continue;
      const html=await r.text();
      const m=html.match(/"externalId":"(UC[\w-]{22})"/)||html.match(/<link rel="canonical" href="https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})"/)||html.match(/"channelId":"(UC[\w-]{22})"/);
      if(m){const n=html.match(/<meta property="og:title" content="([^"]*)"/);return{id:m[1],name:n?n[1].replace(/&amp;/g,'&').replace(/&#39;/g,"'"):''}}
    }catch(_){}
  }
  return null;
}
async function apiChannel(qs,key){
  try{
    const r=await fetch('https://www.googleapis.com/youtube/v3/channels?part=id,snippet&'+qs+'&key='+encodeURIComponent(key));
    const j=await r.json();
    if(j.items&&j.items[0])return{id:j.items[0].id,name:j.items[0].snippet.title};
  }catch(_){}
  return null;
}
async function resolveChannelPath(path,key){
  // path: "outdoorboys" | "@outdoorboys" | "c/outdoorboys" | "user/xyz"
  let m,handle=null,user=null;
  if((m=path.match(/^user\/([^\/?#]+)/)))user=m[1];
  else if((m=path.match(/^c\/([^\/?#]+)/)))handle=m[1];
  else if((m=path.match(/^@?([^\/?#]+)/)))handle=m[1];
  handle&&(handle=decodeURIComponent(handle).replace(/^@/,''));
  if(key){
    let r=null;
    if(handle)r=await apiChannel('forHandle=@'+encodeURIComponent(handle),key);
    if(!r&&(user||handle))r=await apiChannel('forUsername='+encodeURIComponent(user||handle),key);
    if(r)return r;
  }
  const urls=[];
  if(user)urls.push('https://www.youtube.com/user/'+user);
  if(handle){urls.push('https://www.youtube.com/@'+handle);urls.push('https://www.youtube.com/c/'+handle);urls.push('https://www.youtube.com/'+handle)}
  for(const u of urls){const r=await fetchPage(u);if(r)return r}
  throw new Error('no se pudo resolver el canal (prueba con el ID UC… o agrega una API key)');
}
async function parseSource(src,key){
  src=src.trim();let m;
  if(!src)throw new Error('falta la URL');
  if((m=src.match(/[?&]list=([\w-]+)/)))return{name:'Lista '+m[1].slice(-4),list:m[1]};
  if((m=src.match(/(UC[\w-]{22})/)))return{name:'',list:'UU'+m[1].slice(2),needName:m[1]};
  if((m=src.match(/^(PL|UU|OL|FL|LL)[\w-]{10,}$/)))return{name:'Lista '+src.slice(-4),list:src};
  if((m=src.match(/[?&]v=([\w-]{11})/)||src.match(/youtu\.be\/([\w-]{11})/)||src.match(/\/(?:live|shorts|embed)\/([\w-]{11})/)))return{name:'Video '+m[1].slice(0,4),vid:m[1]};
  let path=src.replace(/^https?:\/\//i,'').replace(/^(www\.|m\.)?youtube\.com\/?/i,'').replace(/^\/+/,'');
  if(!path)throw new Error('URL no reconocida');
  const r=await resolveChannelPath(path,key);
  return{name:r.name,list:'UU'+r.id.slice(2)};
}

/* ---------- Editor ---------- */
function openEditor(){
  $('#apikey').value=LS('zap_key','');$('#status').textContent='';
  renderEditor();$('#editor').classList.add('on');setTimeout(()=>$('#nUrl').focus(),50);
}
function closeEditor(){$('#editor').classList.remove('on');if(channels.length&&powered&&!channels[cur])tune(0)}
function renderEditor(){
  renderCats();
  $('#elist').innerHTML=channels.map((c,i)=>`<div class="erow" data-i="${i}">
    <b>${String(i+1).padStart(2,'0')}</b>
    <input type="text" class="en" value="${esc(c.name)}" placeholder="Nombre">
    <input type="text" class="ec" list="cats" value="${esc(c.cat)}" placeholder="Categoría">
    <button class="sm ed" title="Eliminar">🗑</button>
    <div class="u">${esc(c.src||'')}</div></div>`).join('')||'<p>Todavía no hay canales.</p>';
}
$('#elist').addEventListener('change',e=>{
  const row=e.target.closest('.erow');if(!row)return;const c=channels[+row.dataset.i];
  if(e.target.classList.contains('en'))c.name=e.target.value.trim()||c.name;
  if(e.target.classList.contains('ec'))c.cat=e.target.value.trim()||'General';
  saveCh();renderCats();renderGuide();
});
$('#elist').addEventListener('click',e=>{
  if(!e.target.classList.contains('ed'))return;
  const i=+e.target.closest('.erow').dataset.i;
  if(!confirm('¿Eliminar "'+channels[i].name+'"?'))return;
  channels.splice(i,1);saveCh();
  if(cur>=channels.length)cur=Math.max(0,channels.length-1);
  else if(cur>i)cur--;
  SV('zap_cur',cur);renderEditor();renderGuide();
});
async function addChannel(){
  const url=$('#nUrl').value.trim(),name=$('#nName').value.trim(),cat=$('#nCat').value.trim()||'General';
  const key=$('#apikey').value.trim();SV('zap_key',key);
  if(!url){$('#status').textContent='Ingresa la URL del canal.';return}
  $('#status').textContent='Resolviendo…';$('#nAdd').disabled=true;
  try{
    const r=await parseSource(url,key);
    if(r.needName&&!name){const n=await fetchPage('https://www.youtube.com/channel/'+r.needName);r.name=n&&n.name?n.name:r.needName.slice(0,10)}
    const ch={name:name||r.name||'Canal',src:url,cat};
    if(r.list)ch.list=r.list;else ch.vid=r.vid;
    channels.push(ch);saveCh();
    $('#nName').value='';$('#nUrl').value='';
    $('#status').textContent='✔ Agregado: '+ch.name+' ('+ch.cat+')';
    renderEditor();renderGuide();
    if(channels.length===1&&powered)tune(0);
  }catch(e){$('#status').textContent='Error: '+e.message}
  $('#nAdd').disabled=false;
}
$('#nAdd').onclick=addChannel;
['#nName','#nUrl','#nCat'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addChannel()}}));
$('#apikey').addEventListener('change',e=>SV('zap_key',e.target.value.trim()));
$('#eClose').onclick=closeEditor;
$('#eExport').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(channels,null,1)],{type:'application/json'}));
  a.download='zaptv-canales.json';a.click();
};
$('#eImport').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(!Array.isArray(j))throw 0;
    const ok=j.filter(c=>c&&c.name&&(c.list||c.vid)).map(c=>({...c,cat:c.cat||'General'}));
    if(!ok.length)throw 0;
    channels=ok;saveCh();cur=0;renderEditor();renderGuide();
    $('#status').textContent='✔ Importados '+ok.length+' canales';
  }catch(_){$('#status').textContent='Archivo inválido'}
  e.target.value='';
};

/* ---------- Controles ---------- */
$('#bGuide').onclick=toggleGuide;$('#gClose').onclick=toggleGuide;
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bRand').onclick=rand;
$('#bVNext').onclick=vNext;$('#bVPrev').onclick=vPrev;
$('#bPlay').onclick=togglePlay;$('#bMute').onclick=toggleMute;$('#bFull').onclick=toggleFull;$('#bEdit').onclick=openEditor;
$('#vol').value=vol;
$('#vol').oninput=e=>{vol=+e.target.value;SV('zap_vol',vol);if(ready){player.setVolume(vol);if(vol>0&&muted){muted=false;player.unMute()}}};
function togglePlay(){if(!ready)return;player.getPlayerState()===1?player.pauseVideo():player.playVideo()}
function toggleMute(){if(!ready)return;muted=!muted;muted?player.mute():player.unMute();$('#bMute').textContent=muted?'🔇':'🔊'}
function toggleFull(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}

function showUI(){$('#bar').classList.remove('hide');clearTimeout(uiT);uiT=setTimeout(()=>{if(!$('#guide').classList.contains('on'))$('#bar').classList.add('hide')},3500)}
addEventListener('mousemove',showUI);addEventListener('touchstart',showUI,{passive:true});
$('#tap').addEventListener('click',()=>{$('#guide').classList.remove('on');$('#bar').classList.contains('hide')?showUI():$('#bar').classList.add('hide')});
$('#tap').addEventListener('dblclick',toggleFull);
let wl=0;$('#tap').addEventListener('wheel',e=>{const t=Date.now();if(t-wl<500)return;wl=t;e.deltaY<0?next():prev()},{passive:true});
let ty=null;$('#tap').addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
$('#tap').addEventListener('touchend',e=>{if(ty==null)return;const d=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(d)>70){d<0?next():prev()}},{passive:true});

addEventListener('keydown',e=>{
  if(!powered)return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){if(e.key==='Escape'){document.activeElement.blur();closeEditor()}return}
  const k=e.key;
  if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();next()}
  else if(k==='ArrowDown'||k==='PageDown'){e.preventDefault();prev()}
  else if(k==='ArrowRight')vNext();else if(k==='ArrowLeft')vPrev();
  else if(k===' '){e.preventDefault();togglePlay()}
  else if(k==='m'||k==='M')toggleMute();
  else if(k==='f'||k==='F')toggleFull();
  else if(k==='g'||k==='G')toggleGuide();
  else if(k==='r'||k==='R')rand();
  else if(k==='c'||k==='C')cycleCat();
  else if(k==='e'||k==='E')openEditor();
  else if(k==='Escape'){$('#guide').classList.remove('on');closeEditor()}
  else if(/^\d$/.test(k)){
    numBuf=(numBuf+k).slice(-3);osd(numBuf);clearTimeout(numT);
    numT=setTimeout(()=>{const n=parseInt(numBuf,10);numBuf='';
      if(n>=1&&n<=channels.length){if(filter&&channels[n-1].cat!==filter)setFilter('',false);tune(n-1)}else osd()},1200);
  }
});

$('#power').onclick=()=>{
  powered=true;$('#power').style.display='none';showUI();
  if(ready){tune(cur)}
};
renderCats();renderGuide();
</script>
</body>
</html>
