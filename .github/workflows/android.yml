name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon -PverCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZapTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZapTV-apk
          path: ZapTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ZapTV APK (última versión)
          body: Descarga ZapTV.apk e instálalo (Android / Android TV).
          files: ZapTV.apk
          make_latest: true
